name: Windows Mobile - Build appxbundle

# Builds the Shasta Windows 10 Mobile client (windows-mobile/Shasta/) on
# every push that touches it, plus manual dispatch. UWP only compiles on
# Windows with the full toolchain — this is the first real "does it
# compile" signal, since local development here has no UWP-capable
# Visual Studio (see wp-apps/07-build-e-ci-cd.md).
#
# Release + .NET Native, not Debug — confirmed by inspecting a real built
# .appxbundle: a Debug/JIT build declares a hard dependency on
# Microsoft.NET.CoreRuntime.1.1, and MSBuild's automatic Dependencies-
# folder packaging on this runner only bundles that framework's
# redistributable for ARM64/x64/x86 — never plain ARM (32-bit), which is
# what the actual Lumia target needs. Release+.NET Native drops that
# specific dependency, but still needs Microsoft.NET.Native.Framework.1.7
# and Microsoft.NET.Native.Runtime.1.7, and MSBuild's auto-packaging has
# the exact same ARM gap for those too — even though the files themselves
# genuinely exist on the runner (confirmed by direct filesystem search),
# just at a legacy path
# (Microsoft SDKs\UWPNuGetPackages\...\arm\...) that the packaging step
# doesn't seem to consult for the ARM platform specifically. So this
# workflow copies them onto the download page manually, as one-time
# installs alongside the certificate — see the "Publish" step below and
# download-page/index.html. VCLibs.140.00 is also a declared dependency
# but is NOT bundled this way: real Windows 10 Mobile devices almost
# certainly already have it (it's used by countless built-in/Store apps),
# unlike a disposable CI VM which starts with nothing — if a device
# somehow lacks it, that would surface as a distinct install-time error
# naming VCLibs specifically, not the silent "no splash screen" crash
# this whole investigation was about. The App.xaml.cs global exception
# handler stays in place as a mitigation for .NET Native's own known
# (separate) failure mode — silent AOT bugs in code patterns that work
# fine under JIT.

on:
  push:
    branches: [main]
    paths:
      - "windows-mobile/Shasta/**"
      - ".github/workflows/windows-mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the sideload certificate exists
        shell: pwsh
        run: |
          $pfx = "windows-mobile/Shasta/Shasta_TemporaryKey.pfx"
          if (-not (Test-Path $pfx)) {
            Write-Error "Certificate not found at $pfx. Run the 'Windows Mobile - Generate Signing Certificate' workflow first, wait for it to finish, then re-run this one."
            exit 1
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows 10 SDK 17763 (UWP metadata)
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 17763

      - name: Restore NuGet packages and build the appxbundle
        shell: cmd
        run: |
          msbuild windows-mobile\Shasta\Shasta.csproj ^
            /restore ^
            /p:Configuration=Release ^
            /p:Platform=ARM ^
            /p:AppxBundlePlatforms=ARM ^
            /p:AppxBundle=Always ^
            /p:UapAppxPackageBuildMode=SideloadOnly ^
            /p:UseDotNetNativeToolchain=true ^
            /p:AppxPackageSigningEnabled=true ^
            /p:PackageCertificateKeyFile=Shasta_TemporaryKey.pfx ^
            /p:PackageCertificatePassword=U0PY2fbJGA8VjQqSi7mZgXwOvsIT ^
            /p:AppxPackageDir=%CD%\AppPackages\ ^
            /verbosity:minimal

      - name: Publish the appxbundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shasta-mobile-appxbundle
          path: AppPackages/**
          if-no-files-found: error

      - name: Publish the appxbundle and version.json (stable download link)
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path AppPackages -Recurse -Filter *.appxbundle | Select-Object -First 1
          if (-not $bundle) {
            Write-Error "No .appxbundle found in AppPackages."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path app | Out-Null
          Copy-Item $bundle.FullName -Destination "app/app.appxbundle" -Force
          Copy-Item "windows-mobile/Shasta/download-page/index.html" -Destination "app/index.html" -Force
          Copy-Item "windows-mobile/Shasta/shasta-mobile-public-cert.cer" -Destination "app/shasta-mobile-public-cert.cer" -Force

          # ARM (32-bit) .NET Native framework redistributables — MSBuild's
          # own Dependencies-folder packaging skips these for the ARM
          # platform (see the workflow header comment), so they're copied
          # onto the download page directly from where they actually live
          # on this runner. Searched dynamically rather than hardcoded to
          # a specific SDK package version/path, since that will drift as
          # GitHub updates the windows-latest runner image over time —
          # whatever version is actually installed right now is what gets
          # used. Fails loudly if nothing matches at all, rather than
          # silently shipping a download page missing a required install
          # step.
          $sdkRoot = "${env:ProgramFiles(x86)}\Microsoft SDKs\UWPNuGetPackages"
          $frameworkArm = Get-ChildItem $sdkRoot -Recurse -Filter "Microsoft.NET.Native.Framework.*.appx" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "(?i)[\\\-]arm[\\\-.]" -and $_.FullName -notmatch "(?i)arm64" -and $_.FullName -notmatch "(?i)\.debug\." } |
            Select-Object -First 1
          $runtimeArm = Get-ChildItem $sdkRoot -Recurse -Filter "Microsoft.NET.Native.Runtime.*.appx" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "(?i)[\\\-]arm[\\\-.]" -and $_.FullName -notmatch "(?i)arm64" -and $_.FullName -notmatch "(?i)\.debug\." } |
            Select-Object -First 1
          if (-not $frameworkArm) {
            Write-Error "No ARM Microsoft.NET.Native.Framework*.appx found anywhere under $sdkRoot. See wp-apps/07-build-e-ci-cd.md's ARM framework redistributable section for how to re-diagnose this."
            exit 1
          }
          if (-not $runtimeArm) {
            Write-Error "No ARM Microsoft.NET.Native.Runtime*.appx found anywhere under $sdkRoot. See wp-apps/07-build-e-ci-cd.md's ARM framework redistributable section for how to re-diagnose this."
            exit 1
          }
          Copy-Item $frameworkArm.FullName -Destination "app/microsoft-net-native-framework-arm.appx" -Force
          Copy-Item $runtimeArm.FullName -Destination "app/microsoft-net-native-runtime-arm.appx" -Force

          [xml]$manifest = Get-Content "windows-mobile/Shasta/Package.appxmanifest"
          $version = $manifest.Package.Identity.Version
          $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $versionJson = @{ version = $version; builtAt = $builtAt } | ConvertTo-Json -Compress
          Set-Content -Path "app/version.json" -Value $versionJson -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/app.appxbundle app/version.json app/index.html app/shasta-mobile-public-cert.cer app/microsoft-net-native-framework-arm.appx app/microsoft-net-native-runtime-arm.appx
          git diff --cached --quiet -- app/app.appxbundle app/version.json app/index.html app/shasta-mobile-public-cert.cer app/microsoft-net-native-framework-arm.appx app/microsoft-net-native-runtime-arm.appx
          if ($LASTEXITCODE -eq 0) {
            Write-Host "app/ contents are already up to date, nothing to commit."
          } else {
            git commit -m "chore: update app/ download page contents (automated)"
            git push
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the download folder as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
