name: Windows Mobile - Build appxbundle

# Builds the Shasta Windows 10 Mobile client (windows-mobile/Shasta/) on
# every push that touches it, plus manual dispatch. UWP only compiles on
# Windows with the full toolchain — this is the first real "does it
# compile" signal, since local development here has no UWP-capable
# Visual Studio (see wp-apps/07-build-e-ci-cd.md).
#
# Release + .NET Native, not Debug — confirmed by inspecting a real built
# .appxbundle: a Debug/JIT build declares a hard dependency on
# Microsoft.NET.CoreRuntime.1.1, and the modern Windows SDK on this runner
# only carries that framework's redistributable for ARM64/x64/x86 — there
# is no ARM (32-bit) copy anymore, which is what the actual Lumia target
# needs. Result: the package can never resolve its dependency and Windows
# refuses to activate it at all — not even the splash screen renders,
# since that never gets a chance to run. .NET Native AOT-compiles the app
# instead, dropping the CoreRuntime dependency entirely (only VCLibs
# remains, which real Windows 10 Mobile devices already carry). The
# App.xaml.cs global exception handler stays in place as a mitigation for
# .NET Native's own known (separate) failure mode — silent AOT bugs in
# code patterns that work fine under JIT.

on:
  push:
    branches: [main]
    paths:
      - "windows-mobile/Shasta/**"
      - ".github/workflows/windows-mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the sideload certificate exists
        shell: pwsh
        run: |
          $pfx = "windows-mobile/Shasta/Shasta_TemporaryKey.pfx"
          if (-not (Test-Path $pfx)) {
            Write-Error "Certificate not found at $pfx. Run the 'Windows Mobile - Generate Signing Certificate' workflow first, wait for it to finish, then re-run this one."
            exit 1
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows 10 SDK 17763 (UWP metadata)
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 17763

      - name: Restore NuGet packages and build the appxbundle
        shell: cmd
        run: |
          msbuild windows-mobile\Shasta\Shasta.csproj ^
            /restore ^
            /p:Configuration=Release ^
            /p:Platform=ARM ^
            /p:AppxBundlePlatforms=ARM ^
            /p:AppxBundle=Always ^
            /p:UapAppxPackageBuildMode=SideloadOnly ^
            /p:UseDotNetNativeToolchain=true ^
            /p:AppxPackageSigningEnabled=true ^
            /p:PackageCertificateKeyFile=Shasta_TemporaryKey.pfx ^
            /p:PackageCertificatePassword=U0PY2fbJGA8VjQqSi7mZgXwOvsIT ^
            /p:AppxPackageDir=%CD%\AppPackages\ ^
            /verbosity:minimal

      # TEMPORARY diagnostic step — investigating why the built .appxbundle
      # has no ARM (32-bit) framework redistributables (only ARM64/x64/x86)
      # even though the app targets Platform=ARM. Lists every .appx found
      # anywhere in the restored NuGet package cache whose path mentions
      # "arm" but not "arm64", plus the full folder layout of the specific
      # NuGet packages that provide these redistributables. Remove once
      # resolved.
      - name: Diagnose ARM framework redistributable availability
        shell: pwsh
        run: |
          Write-Host "=== Resolved package paths from the generated nuget.g.props ==="
          $propsPath = "windows-mobile\Shasta\obj\Shasta.csproj.nuget.g.props"
          if (Test-Path $propsPath) {
            Get-Content $propsPath | Select-String -Pattern "Pkg|PackageFolder" | ForEach-Object { Write-Host $_.Line }
          } else {
            Write-Host "not found at $propsPath"
          }

          Write-Host ""
          Write-Host "=== Candidate legacy SDK/NuGet package roots that exist on this runner ==="
          $candidateRoots = @(
            "${env:ProgramFiles(x86)}\Microsoft SDKs\NuGetPackages",
            "${env:ProgramFiles(x86)}\Microsoft SDKs\UWPNuGetPackages",
            "$env:USERPROFILE\.nuget\packages",
            "C:\ProgramData\Microsoft\NuGet"
          )
          foreach ($root in $candidateRoots) {
            if (Test-Path $root) {
              Write-Host "EXISTS: $root"
            } else {
              Write-Host "missing: $root"
            }
          }

          Write-Host ""
          Write-Host "=== Targeted search under UWPNuGetPackages for ARM (not ARM64) redistributables ==="
          $sdkRoot = "${env:ProgramFiles(x86)}\Microsoft SDKs\UWPNuGetPackages"
          Get-ChildItem $sdkRoot -Recurse -Filter "*.appx" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "(?i)[\\\-]arm[\\\-.]" -and $_.FullName -notmatch "(?i)arm64" -and $_.FullName -notmatch "(?i)\.debug\." } |
            ForEach-Object { Write-Host $_.FullName }

          Write-Host ""
          Write-Host "=== VCLibs ExtensionSDK folder listing (standard install location) ==="
          $vclibsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs"
          if (Test-Path $vclibsRoot) {
            Get-ChildItem $vclibsRoot -Recurse -Filter "*.appx" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "not found at $vclibsRoot"
          }

      - name: Publish the appxbundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shasta-mobile-appxbundle
          path: AppPackages/**
          if-no-files-found: error

      - name: Publish the appxbundle and version.json (stable download link)
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path AppPackages -Recurse -Filter *.appxbundle | Select-Object -First 1
          if (-not $bundle) {
            Write-Error "No .appxbundle found in AppPackages."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path app | Out-Null
          Copy-Item $bundle.FullName -Destination "app/app.appxbundle" -Force
          Copy-Item "windows-mobile/Shasta/download-page/index.html" -Destination "app/index.html" -Force
          Copy-Item "windows-mobile/Shasta/shasta-mobile-public-cert.cer" -Destination "app/shasta-mobile-public-cert.cer" -Force

          [xml]$manifest = Get-Content "windows-mobile/Shasta/Package.appxmanifest"
          $version = $manifest.Package.Identity.Version
          $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $versionJson = @{ version = $version; builtAt = $builtAt } | ConvertTo-Json -Compress
          Set-Content -Path "app/version.json" -Value $versionJson -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/app.appxbundle app/version.json app/index.html app/shasta-mobile-public-cert.cer
          git diff --cached --quiet -- app/app.appxbundle app/version.json app/index.html app/shasta-mobile-public-cert.cer
          if ($LASTEXITCODE -eq 0) {
            Write-Host "app/ contents are already up to date, nothing to commit."
          } else {
            git commit -m "chore: update app/ download page contents (automated)"
            git push
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the download folder as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
